<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TradeLog — Personal Trading Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#0b0f19' }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="app-root"></div>

  <!-- React & Babel for browser bundle -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // Standalone simplified interactive launcher preview
    function StandaloneApp() {
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 text-center">
          <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-indigo-600 p-0.5 shadow-2xl shadow-emerald-500/20 mb-4">
            <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-3xl">
              📈
            </div>
          </div>
          <h1 className="text-3xl font-extrabold text-white tracking-tight">Trade<span className="text-emerald-400">Log</span></h1>
          <p className="text-sm text-slate-400 mt-2 max-w-md">
            Personal Trading Journal & Mindset Reflection App for iOS, Android, Tablet & Desktop.
          </p>

          <div className="mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 text-left max-w-lg w-full space-y-4">
            <h3 className="text-xs font-bold text-emerald-400 uppercase tracking-wider">🚀 Quick Start Instructions</h3>
            <div className="text-xs text-slate-300 space-y-2">
              <p>1. Open your terminal in <code className="bg-slate-950 px-2 py-0.5 rounded text-emerald-400">/data/sem/journal</code></p>
              <p>2. Run <code className="bg-slate-950 px-2 py-0.5 rounded text-emerald-400">npm install</code></p>
              <p>3. Run <code className="bg-slate-950 px-2 py-0.5 rounded text-emerald-400">npm run dev</code> to start Vite dev server!</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app-root')).render(<StandaloneApp />);
  </script>
</body>
</html>
